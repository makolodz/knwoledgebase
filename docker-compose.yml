# Services de développement : MongoDB et Mailpit. L'API et le front tournent sur la machine
# (`pnpm dev`), pas en conteneur (docs/decisions/ADR-013-outillage-monorepo.md).
#
# Les ports sont liés à 127.0.0.1 : MongoDB n'a pas d'authentification en local et ne doit pas
# être joignable depuis le réseau.
name: encheres

services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Capture tous les emails envoyés par l'API : interface web sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # interface web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
