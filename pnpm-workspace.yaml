packages:
  - apps/*
  - packages/*

# Versions partagées entre les paquets (ADR-013).
catalog:
  "@eslint/js": ^10.0.1
  "@types/node": ^22.20.5
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-vue: ^10.11.1
  globals: ^17.13.0
  prettier: ^3.9.10
  # TypeScript reste en 6.0 : typescript-eslint 8.x déclare typescript < 6.1.
  typescript: ~6.0.3
  typescript-eslint: ^8.71.1
  # Épinglés sur la version précédente : pnpm 12 refuse les versions trop récentes (minimumReleaseAge).
  vitest: 5.0.3
  zod: 4.6.5
