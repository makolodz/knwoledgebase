name: Audit des dépendances

# Vulnérabilités connues dans les dépendances (`pnpm audit`, lit seulement pnpm-lock.yaml).
# Workflow à part de ci.yml : un nouvel avis de sécurité publié du jour au lendemain ne doit pas
# rendre rouge une PR qui n'a rien changé, donc ce contrôle n'est pas à rendre obligatoire.
# Il tourne quand les dépendances changent, et chaque lundi pour voir les avis publiés depuis.
on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Mêmes actions, épinglées par SHA, que dans ci.yml ; Dependabot les met à jour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Ce qui est livré : échec dès « high ».
      - run: pnpm audit --prod --audit-level high
      # Outillage de développement (il tourne en CI) : échec seulement pour « critical ».
      - run: pnpm audit --dev --audit-level critical
